<div class="profile-container">
    <h2>User Profile</h2>
  
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          formControlName="firstName"
          class="form-control"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          formControlName="lastName"
          class="form-control"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [readonly]="true"
        />
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">
        Update Profile
      </button>
    </form>
  
    <hr />
  
    <!-- Change Password Section -->
    <button class="btn btn-secondary" (click)="togglePasswordChange()">
      Change Password
    </button>
  
    <div *ngIf="isPasswordChangeVisible">
      <form [formGroup]="profileForm" (ngSubmit)="changePassword()">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            class="form-control"
            [minlength]="8"
          />
        </div>
  
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            class="form-control"
          />
        </div>
  
        <button type="submit" class="btn btn-success">
          Change Password
        </button>
      </form>
    </div>
  </div>
  <div *ngIf="isDataLoading">
    <app-loading [isLoading]="isDataLoading"></app-loading>
  </div>
