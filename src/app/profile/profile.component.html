<div class="profile-container">
  <h2>{{isPasswordChangeVisible?'Change Password':'Update Profile'}}</h2>
   <!-- Profile Image at Top -->
  <div *ngIf="profilePicturePreview" class="profile-img-top">
    <img [src]="profilePicturePreview" alt="Profile Picture Preview" class="profile-img-preview" />
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" *ngIf="!isPasswordChangeVisible">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input
        type="text"
        id="firstName"
        formControlName="firstName"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input
        type="text"
        id="lastName"
        formControlName="lastName"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        [readonly]="true"
      />
    </div>

    <!-- Profile Picture Section -->
    <div class="form-group">
      <label for="profilePicture">Profile Picture</label>
      <input
        type="file"
        id="profilePicture"
        (change)="onFileChange($event)"
        class="form-control"
        accept="image/*"
      />
    </div>

    <div class="button-row">
      <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">
        Update Profile
      </button>
    </div>
  </form>

  <hr />

  <div *ngIf="isPasswordChangeVisible">
    <form [formGroup]="profileForm" (ngSubmit)="changePassword()">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="form-control"
          [minlength]="8"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
        />
      </div>

      <div class="button-row">
        <button type="submit" class="btn btn-success">
          Change Password
        </button>
      </div>
    </form>
  </div>
</div>

<div *ngIf="isDataLoading">
  <app-loading [isLoading]="isDataLoading"></app-loading>
</div>
