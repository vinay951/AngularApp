<div class="compiler-shell">
  <div class="compiler-panel">
    <h1>Online Compiler</h1>

    <div class="toolbar">
      <select [(ngModel)]="selectedLanguage" (change)="changeLanguage(selectedLanguage)">
        <option value="java">Java</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
      </select>

      <select [(ngModel)]="mode" (change)="modeChange(mode)">
        <option value="ai">AI Mode</option>
        <option value="dynamic">Dynamic Mode</option>
      </select>
    </div>

    <textarea *ngIf="mode === 'ai'" [(ngModel)]="aiInput" rows="4" placeholder="Describe the code you want to generate..."></textarea>
    <button *ngIf="mode === 'ai'" class="primary-btn" (click)="generateCodeWithAI()">Generate Code with AI</button>

    <textarea [(ngModel)]="code" rows="10" placeholder="Enter your code here..."></textarea>
    <button class="primary-btn" (click)="executeCode()">Execute</button>

    <h3>Output</h3>
    <pre>{{ output }}</pre>
  </div>

  <div *ngIf="isDataLoading">
    <app-loading [isLoading]="isDataLoading"></app-loading>
  </div>
</div>
