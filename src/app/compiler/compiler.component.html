<div style="text-align:center; margin-top: 50px;">
    <h1>Online Compiler</h1>
    
    <!-- Dropdown to select language -->
    <select [(ngModel)]="selectedLanguage" (change)="changeLanguage(selectedLanguage)">
      <option value="java">Java</option>
      <option value="python">Python</option>
      <option value="cpp">C++</option>
    </select><br/><br/>
    
    <!-- Textarea to input code -->
    <textarea [(ngModel)]="code" rows="10" cols="50" placeholder="Enter your code here..."></textarea><br/><br/>
    
    <!-- Button to execute code -->
    <button (click)="executeCode()">Execute</button><br/><br/>
    
    <!-- Output area -->
    <h3>Output:</h3>
    <pre style="white-space: pre-wrap; word-wrap: break-word; text-align: left; margin-top: 10px; padding: 15px; background-color: #333; color: white; border-radius: 8px; width: 80%; margin: 0 auto;">
      {{ output }}
    </pre>
  </div>
  
  
  <div *ngIf="isDataLoading">
    <app-loading [isLoading]="isDataLoading"></app-loading>
  </div>
