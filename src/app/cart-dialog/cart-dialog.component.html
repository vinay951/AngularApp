<div class="cart-big pro">
  <header class="cart-header-pro">
    <h2 class="cart-title">Your Cart</h2>
    <span class="item-count">{{ items.length }} items</span>
  </header>

  <section *ngIf="items.length === 0; else cartContent" class="empty-pro">
    <p>No items in cart.</p>
  </section>

  <ng-template #cartContent>
    <div class="cart-body-pro">
      <div class="cart-items-pro">
        <div class="cart-card-pro" *ngFor="let p of items">
          <img [src]="p.imageUrl" [alt]="p.name" class="cart-img-pro" />
          <div class="cart-info-pro">
            <div class="cart-header-row">
              <h3 class="name">{{ p.name }}</h3>
              <span class="price">₹{{ p.price }}</span>
            </div>
            <p class="brand">Brand: {{ p.brand }}</p>
            <p class="rating">★ {{ p.rating | number:'1.1-1' }}/5</p>
          </div>
        </div>
      </div>
      <div class="summary-pro">
        <span>Total</span>
        <span class="total">₹{{ total }}</span>
      </div>
      <div class="actions-pro">
        <button class="btn-pro primary" (click)="checkout()">Checkout</button>
      </div>
    </div>
  </ng-template>
</div>
