<div class="test-case-wrapper">
  <h2 class="title">Test Cases</h2>
  
  <!-- Loop through each test case -->
  <div *ngFor="let testCase of testCases" class="test-case-cell">
    <div class="test-case-header">
      <!-- Test case name -->
      <span class="test-case-name">{{ testCase.name }}</span>
    </div>

    <div class="test-case-footer">
      <!-- Run button with loading spinner -->
      <button class="run-button" (click)="onRunButtonClick(testCase)" [disabled]="testCase.isLoading">
        <!-- Show loading spinner while test case is running -->
        <span *ngIf="testCase.isLoading" class="loading-spinner"></span>
        <span *ngIf="!testCase.isLoading">Run</span>
      </button>
    </div>
  </div>
</div>
<div *ngIf="isDataLoading">
  <app-loading [isLoading]="isDataLoading"></app-loading>
</div>
