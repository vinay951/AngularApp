<!-- Floating circular button -->
<div *ngIf="!isChatOpen" class="chat-button" (click)="toggleChat()">
    <span>HELP</span>
  </div>
  
  <!-- Chat window -->
  <div [ngClass]="{'chat-window': true, 'open': isChatOpen}">
    <div class="chat-header">
      <span>Enter Description to route to particular page ex: search for strange</span>
      <button class="close-btn" (click)="toggleChat()">X</button>
    </div>
  
    <div class="chat-box">
      <div class="messages-container" #messagesContainer>
        <div *ngFor="let message of botMessages" class="message">
          {{ message }}
        </div>
      </div>

      <div class="loading-overlay" *ngIf="isLoading" role="status" aria-live="polite">
        <div class="car-loader" aria-hidden="false">
          <div class="car">
            <div class="car-body">
              <div class="car-window"></div>
            </div>
            <div class="wheel wheel-back"></div>
            <div class="wheel wheel-front"></div>
            <div class="boost">
              <div class="flame"></div>
              <div class="flame small"></div>
            </div>
          </div>
          <div class="road">
            <div class="road-line"></div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="input-container">
      <input [(ngModel)]="userMessage" (keyup.enter)="onEnter()" placeholder="Type your message" [disabled]="isLoading" [attr.aria-disabled]="isLoading" />
      <button (click)="sendMessage()" [disabled]="isLoading" [attr.aria-disabled]="isLoading">Send</button>
    </div>
  </div>
