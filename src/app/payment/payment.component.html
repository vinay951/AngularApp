<div class="payment-container pro">
  <div class="payment-card">
    <h2 class="payment-title">Checkout & Payment</h2>
    <div class="products-list" *ngIf="products.length > 0">
      <h3 class="section-title">Your Products</h3>
      <div class="product-list-flex">
        <div class="product-card-pro" *ngFor="let p of products">
          <img *ngIf="p.imageUrl" [src]="p.imageUrl" [alt]="p.name" class="product-img-pro" />
          <div class="product-info-pro">
            <div class="product-header">
              <h4>{{ p.name }}</h4>
              <span class="price">₹{{ p.price }}</span>
            </div>
            <p class="brand">Brand: {{ p.brand }}</p>
            <p class="desc">{{ p.description }}</p>
            <p class="rating">Rating: <span class="star">★</span> {{ p.rating }}/5</p>
          </div>
        </div>
      </div>
      <div class="summary-pro">
        <span>Total</span>
        <span class="total">₹{{ total }}</span>
      </div>
    </div>
    <div class="actions-pro">
      <button class="btn-pro primary" (click)="onBuy()">Buy Now</button>
      <button class="btn-pro" (click)="onCancel()">Cancel</button>
    </div>
  </div>
</div>

<div *ngIf="isDataLoading">
  <app-loading [isLoading]="isDataLoading"></app-loading>
</div>
