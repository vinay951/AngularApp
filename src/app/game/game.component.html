<div class="modern-racer">
  <div class="top-bar">
    <div>
      <span class="eyebrow">Arcade Project</span>
      <h1>Night Drift</h1>
    </div>

    <div class="score-group">
      <div class="score-box">
        <span>Score</span>
        <strong>{{ carScore }}</strong>
      </div>
      <div class="score-box best">
        <span>Best</span>
        <strong>{{ carBestScore }}</strong>
      </div>
    </div>
  </div>

  <div class="status-row">
    <span class="status-pill" [class.running]="carIsActive && !carGameOver" [class.crashed]="carGameOver">
      {{ carGameOver ? 'Crash' : carIsActive ? 'Live' : 'Ready' }}
    </span>
    <span class="status-text">{{ gameStatus }}</span>
  </div>

  <div class="road-shell">
    <div class="road-board" [style.width.px]="carLaneCount * tileSize" [style.height.px]="carBoardHeight * tileSize">
      <div *ngFor="let y of [].constructor(carBoardHeight); let row = index" class="row">
        <div
          *ngFor="let x of [].constructor(carLaneCount); let col = index"
          class="tile"
          [ngClass]="getCarTileClass(col, row)"
          [style.width.px]="tileSize"
          [style.height.px]="tileSize">
        </div>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <button class="control-btn" type="button" (click)="moveCarLeft()" [disabled]="!carIsActive || carGameOver || isPaused">◀ Left</button>
    <button class="primary-btn" type="button" *ngIf="!carIsActive && !carGameOver" (click)="startCarGame()">Start</button>
    <button class="primary-btn" type="button" *ngIf="carIsActive && !carGameOver" (click)="togglePause()">{{ isPaused ? 'Resume' : 'Pause' }}</button>
    <button class="control-btn" type="button" (click)="moveCarRight()" [disabled]="!carIsActive || carGameOver || isPaused">Right ▶</button>
  </div>

  <div class="utility-row">
    <button class="ghost-btn" type="button" (click)="resetCarGame()">Reset</button>
    <button class="ghost-btn" type="button" (click)="stopCarGame()">Stop</button>
  </div>
</div>
