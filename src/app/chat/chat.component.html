<div class="chat-container">
  <div class="chat-header">
    <h2>Chat with GPT</h2>
  </div>
  <div class="chat-box">
    <div *ngFor="let message of messages" class="message" [ngClass]="{'user': message.sender === 'user', 'bot': message.sender === 'bot'}">
      <p *ngIf="!message.isHtml">{{ message.text }}</p>
      <p *ngIf="message.isHtml" [innerHTML]="message.text"></p>
    </div>
  </div>
  <div class="input-container">
    <input [(ngModel)]="userMessage" type="text" placeholder="Type a message..." [disabled]="isLoading" />
    <button (click)="sendMessage()" [disabled]="isLoading">Send</button>
  </div>
  <button class="clear-button" (click)="clearChat()" [disabled]="isLoading">Clear</button>
  <div *ngIf="isLoading" class="loading-spinner">Loading...</div>
</div>
