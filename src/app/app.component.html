
<div class="app-shell">
  <header *ngIf="checkmethod()" class="top-header">
    <app-header></app-header>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <app-chatbot></app-chatbot>

  <footer class="site-footer">
    <app-footer></app-footer>
  </footer>

  <div *ngIf="isOfflineModalOpen" class="offline-modal">
    <div class="offline-modal-content">
      <p>You are offline. Please check your internet connection.</p>
      <button type="button" (click)="closeOfflineModal()">Close</button>
    </div>
  </div>
</div>
