<nav class="app-header" role="navigation" aria-label="Main navigation">
  <div class="header-inner">
    <a class="brand" [routerLink]="['/home']" href="/home">
      <img src="compiler.png" alt="Online Compiler logo" class="logo" />
      <span class="brand-title">Online Compiler</span>
    </a>

    <form class="header-search" (submit)="onSearch($event)" role="search">
      <label for="header-search-input" class="visually-hidden">Search</label>
      <input id="header-search-input" name="q" type="search" [(ngModel)]="searchQuery" (input)="onSearchInput()" placeholder="Search menu..." autocomplete="off" />
      <button type="submit" class="search-btn" aria-label="Search">🔍</button>
      <ul *ngIf="showSuggestions" class="search-suggestions">
        <li *ngFor="let item of filteredMenuItems" (mousedown)="onSuggestionClick(item)">
          {{item.label}}
        </li>
      </ul>
    </form>

    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-pressed="false" title="Toggle theme" (click)="toggleDarkMode()">🌓</button>
      <button class="like-btn" type="button" [class.liked]="liked" (click)="toggleLike()" title="Like">❤️</button>
      <button class="keep-btn" type="button" [class.kept]="kept" (click)="toggleKeep()" title="Keep">🔖</button>
      <button class="hamburger" [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()" aria-controls="main-nav" aria-label="Toggle navigation">
        <span class="hamburger-box"><span class="hamburger-inner"></span></span>
      </button>
    </div>
  </div>

  <ul id="main-nav" class="nav-links" [class.open]="isMenuOpen" *ngIf="isMenuOpen" (mouseleave)="closeMenu()">
    <li><a [routerLink]="['/home']" href="/home" (click)="closeMenu()">Home</a></li>
      <li class="submenu">
        <button type="button" class="submenu-toggle" (click)="toggleSubmenu('tests', $event)" [attr.aria-expanded]="submenuOpen['tests']">Tests <span class="caret">▾</span></button>
        <ul *ngIf="submenuOpen['tests']" class="submenu-list">
          <li *ngFor="let item of orderedSubmenuItems('tests')">
            <a href="javascript:void(0);" (click)="onItemClick(item); closeMenu()">
              {{item.label}}
            </a>
            <button *ngIf="item.label !== 'Home'" type="button" class="pin-btn modern" [attr.aria-pressed]="isPinned(item)" (click)="togglePin({label:item.label, route:item.route}, $event)"></button>
          </li>
        </ul>
      </li>
    <!-- Compiler submenu contains Online Compiler and Random Questions -->
    <li class="submenu">
      <button type="button" class="submenu-toggle" (click)="toggleSubmenu('compiler', $event)" [attr.aria-expanded]="submenuOpen['compiler']">Compiler <span class="caret">▾</span></button>
      <ul *ngIf="submenuOpen['compiler']" class="submenu-list">
        <li *ngFor="let item of orderedSubmenuItems('compiler')">
          <a href="javascript:void(0);" (click)="onItemClick(item); closeMenu()">{{item.label}}</a>
          <button type="button" class="pin-btn modern" [attr.aria-pressed]="isPinned(item)" (click)="togglePin({label:item.label, route:item.route}, $event)"></button>
        </li>
      </ul>
    </li>
    <li class="submenu">
      <button type="button" class="submenu-toggle" (click)="toggleSubmenu('account', $event)" [attr.aria-expanded]="submenuOpen['account']">Account <span class="caret">▾</span></button>
        <ul *ngIf="submenuOpen['account']" class="submenu-list">
          <li *ngFor="let item of orderedSubmenuItems('account')">
            <a href="javascript:void(0);" (click)="onItemClick(item); closeMenu()">{{item.label}}</a>
            <button *ngIf="item.label !== 'Logout' && item.label !== 'Login' && item.label !== 'Register'" type="button" class="pin-btn modern" [attr.aria-pressed]="isPinned(item)" (click)="togglePin({label:item.label, route:item.route}, $event)"></button>
          </li>
          <!-- handle special items that may not be in menuItems list -->
        </ul>
    </li>

    <li class="submenu">
        <button type="button" class="submenu-toggle" (click)="toggleSubmenu('others', $event)" [attr.aria-expanded]="submenuOpen['others']">Others <span class="caret">▾</span></button>
        <ul *ngIf="submenuOpen['others']" class="submenu-list">
          <li *ngFor="let item of orderedSubmenuItems('others')">
            <a href="javascript:void(0);" (click)="onItemClick(item); closeMenu()">{{item.label}}</a>
            <button type="button" class="pin-btn modern" [attr.aria-pressed]="isPinned(item)" (click)="togglePin({label:item.label, route:item.route}, $event)"></button>
          </li>
        </ul>
      </li>
  </ul>
</nav>

<div *ngIf="isDataLoading">
  <app-loading [isLoading]="isDataLoading"></app-loading>
</div>
