<div class="shop-search-bar">
  <input
    type="text"
    [(ngModel)]="searchValue"
    (keyup.enter)="onSearch()"
    placeholder="Search products..."
  />
  <button type="button" (click)="onSearch()">Search</button>
</div>

<div class="shop-container" *ngIf="!isLoading; else loading">
  <div class="product-grid">
    <article class="product-card" *ngFor="let p of products">
      <div class="image-wrapper">
        <img [src]="p.imageUrl" [alt]="p.name" loading="lazy" *ngIf="p.imageUrl; else noImage" />
        <ng-template #noImage><span class="no-image">No Image</span></ng-template>
      </div>

      <div class="product-body">
        <h3 class="product-name">{{ p.name }}</h3>
        <p class="product-brand">{{ p.brand }}</p>

        <div class="product-meta">
          <span class="rating">★ {{ p.rating | number:'1.1-1' }}/5</span>
          <span class="price">₹{{ p.price }}</span>
        </div>

        <div class="product-actions">
          <button class="btn outline" type="button" (click)="openProduct(p)">View</button>
          <button class="btn primary" type="button" (click)="buyNow(p)">Buy Now</button>
        </div>
      </div>
    </article>

    <div class="pagination-controls">
      <button type="button" (click)="prevPage()" [disabled]="page === 0">Previous</button>
      <span>Page {{ page + 1 }} of {{ totalPages }}</span>
      <button type="button" (click)="nextPage()" [disabled]="page >= totalPages - 1">Next</button>
    </div>
  </div>
</div>

<ng-template #loading>
  <p class="loading-text">Loading products...</p>
</ng-template>
