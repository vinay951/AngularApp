# /etc/nginx/nginx.conf
events {}

http {
    server {
        listen 8080;
        server_name localhost;

        # Serve static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;  # Angular route fallback
        }

        # Error handling
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
